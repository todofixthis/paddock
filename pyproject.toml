[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phx-paddock"
dynamic = ["version"]
description = "Launch coding agents in isolated Docker containers."
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
requires-python = ">=3.12"
readme = "README.rst"
license = "MIT"
dependencies = [
    "phx-class-registry>=5.2.1,<6.0.0",
    "phx-filters>=4.0.0a2,<5",
]

# :see: https://pypi.org/classifiers/
keywords = [
    "agents",
    "coding",
    "docker",
    "isolation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]

[project.entry-points."paddock.agents"]
claude = "paddock.agents.claude:ClaudeAgent"
false = "paddock.agents.shell:ShellAgent"
opencode = "paddock.agents.opencode:OpenCodeAgent"

[project.entry-points."paddock.servers"]
opencode = "paddock.agents.opencode:OpenCodeServer"

[project.scripts]
paddock = "paddock.__main__:main"

[project.urls]
Repository = "https://github.com/todofixthis/paddock"
Documentation = "https://phx-paddock.readthedocs.io/"
Changelog = "https://github.com/todofixthis/paddock/releases"
Issues = "https://github.com/todofixthis/paddock/issues"

[dependency-groups]
# I'm only one person, so to keep from getting overwhelmed, I'm only committing
# to supporting the 3 most recent versions of Python (see
# https://github.com/todofixthis/cookiecutter-py/blob/main/docs/adr/015-propagate-template-changes-with-copier-and-rotate-python-from-agent-sessions.md).
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-mypy>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "pytest-mock>=3.15.1,<4",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
    "tox>=4,<5",
    "tox-uv>=1,<2",
]

# Used by GitHub Actions and ReadTheDocs.
ci = [
    "black>=26,<27",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "pytest-mock>=3.15.1,<4",
    "ruff>=0.17,<0.18",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
    "tox-uv>=1,<2",
]

[tool.autohooks]
mode = "pythonpath"
pre-commit = ["autohooks.plugins.black", "autohooks.plugins.mypy", "autohooks.plugins.pytest", "autohooks.plugins.ruff", "docs_build"]

[tool.black]
# Explicit, because black otherwise infers every version `requires-python`
# allows, including ones newer than the running interpreter can parse.
target-version = [
    "py314",
    "py313",
    "py312",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/paddock",
    "LICENCE.txt",
    "docs",
    "images",
    "test",
]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel]
include = ["src/paddock"]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel.sources]
"src/paddock" = "paddock"

[tool.hatch.version]
path = "src/paddock/__init__.py"

[tool.mypy]
strict = true

# phx-filters rejects a value by returning `_invalid_value()`'s result (`Any`,
# `None` by default) from a non-Optional `_apply`. Re-enable both codes once
# todofixthis/filters#121 makes rejection raise instead.
[[tool.mypy.overrides]]
module = ["paddock.config.filters"]
disable_error_code = ["no-any-return", "return-value"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff.lint]
# phx-filters' BaseFilter declares `templates` as an instance attribute, so a
# subclass annotating it `ClassVar`, as RUF012 asks, fails mypy's override
# check.
ignore = ["RUF012"]

[tool.tox]
env_list = [
    "py314",
    "py313",
    "py312",
]

[tool.tox.env_run_base]
commands = [
    ["pytest"],
    ["mypy", "src", "test"],
]
runner = "uv-venv-lock-runner"

[tool.uv]
keyring-provider = "subprocess"
# Fix SSL errors when running in Leash containers
system-certs = true
# Resolve only releases at least 3 days old, so a broken or malicious release
# is usually yanked before a lock refresh picks it up (ADR 013 in
# todofixthis/cookiecutter-py). Exempt one package with
# `exclude-newer-package = { <package> = false }`.
exclude-newer = "3 days"
