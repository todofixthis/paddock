# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: CI
on:
  push: ~
permissions:
  contents: read

jobs:
  # The phx plugin's hooks check ADRs in Claude Code sessions but never block, so
  # this is the only check a commit made elsewhere meets (ADR 009 forbids a
  # repo-local copy of the tool). The ref is the 8.0.0 release's commit; bump it,
  # and the one in AGENTS.md, with the plugin release sessions use.
  adrs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check ADRs
        run: uvx --from 'git+https://github.com/todofixthis/phx-claude-siat@4b7694d4999440380e5d2a0176435c5a92e7ad4a#subdirectory=skills/writing-adrs' phx-adr check

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        # The project plus docs tools only, matching ReadTheDocs; `uv run
        # --no-sync` below keeps it that way instead of re-adding dev tools
        run: uv sync --no-default-groups --group docs
      # Same strictness as the pre-commit hook and ReadTheDocs'
      # fail_on_warning, so a commit made with --no-verify can't slip a
      # warning past review.
      - name: Check docs build
        run: uv run --no-sync make -C docs html SPHINXOPTS="-W --keep-going"
      # README.rst is both the docs landing page and PyPI's long description,
      # and Sphinx accepts roles (`:doc:`, `:ref:`) that PyPI's renderer
      # rejects, so the docs build alone can't vouch for the PyPI page.
      - name: Check PyPI renders the README
        run: |
          uv build
          uvx twine@7.0.0 check --strict dist/*

  # The single required status check. Matrix jobs report one check per Python
  # version ("test (3.13)"), so requiring them directly breaks branch protection
  # whenever the matrix rotates; this collapses every job into one stable name.
  # No job here is conditional, so anything short of success fails the gate.
  gate:
    needs: [adrs, docs, lint, test, typecheck]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if any check did not pass
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          echo "❌ Required checks did not all pass: ${{ join(needs.*.result, ', ') }}"
          exit 1

  # The jobs below repeat the pre-commit hook's lint, test and type checks, so a
  # commit made with --no-verify can't slip past review.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      # --locked also fails the job on a uv.lock that has drifted from
      # pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --no-sync black --check .
      - name: Lint
        run: uv run --no-sync ruff check

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      # Same tox environment as `uv run tox` locally, so CI proves each
      # supported Python version the same way contributors do
      - name: Run tests
        run: uv run --no-sync tox run -e ${{ matrix.python-version }}

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      # --locked also fails the job on a uv.lock that has drifted from
      # pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Type check
        run: uv run --no-sync mypy src/
