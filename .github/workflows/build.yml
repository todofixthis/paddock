# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: CI
on:
  push: ~
  # Weekly, so an upstream change that breaks the image build (an apt package,
  # the deadsnakes PPA, NodeSource's setup script, the Ubuntu tag) surfaces
  # without waiting for a commit to touch images/. Runs on the default branch.
  schedule:
    - cron: "43 19 * * 0"
permissions:
  contents: read

jobs:
  # The phx plugin's hooks check ADRs in Claude Code sessions but never block, so
  # this is the only check a commit made elsewhere meets (ADR 009 forbids a
  # repo-local copy of the tool). Renovate bumps the pinned release here and in
  # AGENTS.md together; keep the trailing version comment it matches on.
  adrs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check ADRs
        run: uvx --from 'git+https://github.com/todofixthis/phx-claude-siat@0725567cec6bab6a227c2a3d569e64c226c33a4e#subdirectory=skills/writing-adrs' phx-adr check # 8.1.0

  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.changes.outputs.image }}

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A branch compares against where it left the default branch, not its
      # previous push: diffed per push, a push leaving the image alone would
      # skip the build, and the gate would pass a head commit whose image an
      # earlier push broke. develop and main compare against the previous push;
      # a scheduled run has no previous push, so it always builds.
      - name: Check whether the image changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" || "${GITHUB_REF_NAME}" == main ]]; then
            base="${BEFORE}"
          else
            base=$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD) || base=""
          fi
          # A schedule, a new branch's first push or a force-push can leave no
          # base to diff against, so build
          if [[ -z "${base}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "⚠️ No base commit to diff against; building."
            echo "image=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Anything that changes what the image contains or how it's tested.
          # --no-renames also lists a file moved out of these paths.
          changed=$(git diff --no-renames --name-only "${base}" HEAD -- images/ .github/scripts/smoke-test.sh .github/workflows/build.yml)
          if [[ -n "${changed}" ]]; then
            echo "▶️ Image changed since ${base}; building."
            echo "image=true" >> "${GITHUB_OUTPUT}"
          else
            echo "⏭️ Image unchanged since ${base}; skipping the build."
            echo "image=false" >> "${GITHUB_OUTPUT}"
          fi

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Newest version in the test matrix. Reading `requires-python` from
          # pyproject.toml resolves to the latest CPython, which can outrun
          # dependency wheels.
          python-version: "3.14"
      - name: Install dependencies
        # The project plus docs tools only, matching ReadTheDocs; `uv run
        # --no-sync` below keeps it that way instead of re-adding dev tools
        run: uv sync --no-default-groups --group docs
      # Same strictness as the pre-commit hook and ReadTheDocs'
      # fail_on_warning, so a commit made with --no-verify can't slip a
      # warning past review.
      - name: Check docs build
        run: uv run --no-sync make -C docs html SPHINXOPTS="-W --keep-going"
      # README.rst is both the docs landing page and PyPI's long description,
      # and Sphinx accepts roles (`:doc:`, `:ref:`) that PyPI's renderer
      # rejects, so the docs build alone can't vouch for the PyPI page.
      - name: Check PyPI renders the README
        run: |
          uv build
          uvx twine@7.0.0 check --strict dist/*

  # Builds the bundled Dockerfile once per agent and checks that each install
  # runs, so a Renovate bump that breaks the build fails here rather than for
  # users. The steps, not the job, skip when nothing changed: the job always
  # reports a result, so the gate need not tell a justified skip from a broken
  # condition (ADR 015).
  image:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One agent failing shouldn't cancel the others' builds
      fail-fast: false
      matrix:
        agent: [claude, none, opencode]

    steps:
      - name: Report a skipped build
        if: needs.changes.outputs.image != 'true'
        run: echo "⏭️ Image unchanged; skipping the build."
      - name: Clone repo
        if: needs.changes.outputs.image == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        if: needs.changes.outputs.image == 'true'
        env:
          AGENT: ${{ matrix.agent }}
        run: docker build --build-arg "AGENT=${AGENT}" -t "paddock-smoke:${AGENT}" -f images/Dockerfile images
      - name: Smoke test image
        if: needs.changes.outputs.image == 'true'
        timeout-minutes: 5
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          docker run --rm \
            -v "${PWD}/.github/scripts/smoke-test.sh:/tmp/smoke-test.sh:ro" \
            -v "${PWD}/images/Dockerfile:/tmp/Dockerfile:ro" \
            "paddock-smoke:${AGENT}" \
            bash /tmp/smoke-test.sh /tmp/Dockerfile "${AGENT}"

  # The jobs below repeat the pre-commit hook's lint, test and type checks, so a
  # commit made with --no-verify can't slip past review.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Newest version in the test matrix. Reading `requires-python` from
          # pyproject.toml resolves to the latest CPython, which can outrun
          # dependency wheels.
          python-version: "3.14"
      # --locked also fails the job on a uv.lock that has drifted from
      # pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --no-sync black --check .
      - name: Lint
        run: uv run --no-sync ruff check

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      # Same tox environment as `uv run tox` locally, so CI proves each
      # supported Python version the same way contributors do
      - name: Run tests
        run: uv run --no-sync tox run -e ${{ matrix.python-version }}

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Newest version in the test matrix. Reading `requires-python` from
          # pyproject.toml resolves to the latest CPython, which can outrun
          # dependency wheels.
          python-version: "3.14"
      # --locked also fails the job on a uv.lock that has drifted from
      # pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Type check
        run: uv run --no-sync mypy src/

  # The single required status check, in the main and develop ruleset, so the
  # ruleset needn't list every job or matrix leg. It fails on any job that
  # didn't succeed, a skip included, so a job skipped by mistake can't pass
  # unnoticed (ADR 015). always(), not !cancelled(): a skipped required check
  # counts as passing, so cancelling a run would make its commit mergeable
  # untested.
  gate:
    needs: [adrs, changes, docs, image, lint, test, typecheck]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "❌ A required job failed, was cancelled or was skipped."
          exit 1
      - name: All required jobs succeeded
        run: echo "✅ All required jobs succeeded."
