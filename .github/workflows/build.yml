# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: CI
on:
  push: ~
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        # The project plus docs tools only, matching ReadTheDocs; `uv run
        # --no-sync` below keeps it that way instead of re-adding dev tools
        run: uv sync --no-default-groups --group docs
      # Same strictness as the pre-commit hook and ReadTheDocs'
      # fail_on_warning, so a commit made with --no-verify can't slip a
      # warning past review.
      - name: Check docs build
        run: uv run --no-sync make -C docs html SPHINXOPTS="-W --keep-going"

  # The jobs below repeat the pre-commit hook's lint, test and type checks, so a
  # commit made with --no-verify can't slip past review.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      # --locked also fails the job on a uv.lock that has drifted from
      # pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --no-sync black --check .
      - name: Lint
        run: uv run --no-sync ruff check

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      # Same tox environment as `uv run tox` locally, so CI proves each
      # supported Python version the same way contributors do
      - name: Run tests
        run: uv run --no-sync tox run -e ${{ matrix.python-version }}

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      # --locked also fails the job on a uv.lock that has drifted from
      # pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Type check
        run: uv run --no-sync mypy src/
